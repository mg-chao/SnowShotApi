openapi: 3.1.1
info:
  title: SnowShot API
  version: current
paths:
  /health/live:
    get:
      tags:
      - Health
      operationId: Liveness
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      tags:
      - Health
      operationId: Readiness
      responses:
        '200':
          description: OK
        '503':
          description: Service Unavailable
  /health/components:
