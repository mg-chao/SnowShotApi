  /api/v1/table/extract:
    post:
      tags:
      - Table
      description: Extract one table from a JPEG, PNG or WebP image. Upload one multipart
        file named image, at most 800 KiB and 2880 x 2880 pixels. Returns data.html;
        account authentication is optional.
      operationId: TableExtraction
      parameters:
      - name: X-Request-ID
        in: header
        schema:
          maxLength: 64
          minLength: 0
          pattern: ^[\x21-\x7E]+$
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IFormFile'
        required: true
