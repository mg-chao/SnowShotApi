          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvelope'
  /api/v2/account/transactions:
    get:
      tags:
      - Account
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvelope'
  /api/v2/account/deletion:
    get:
      tags:
      - Account
      description: Returns deletion eligibility and the opaque deletion_version snapshot.
        data.membership_tier is the linked account's advanced-card tier (cny-9-9,
        cny-29-9, cny-88-8, cny-188 or cny-999), calculated from cumulative net recharge
        under the same wallet lock; null means unlinked or below CNY 9.90. Existing
        exact nano-yuan balance fields remain available for settlement checks.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvelope'
    post:
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvelope'
  /api/v2/wechat/events:
    get:
      tags:
      - Account
      responses:
        '200':
          description: OK
    post:
      tags:
      - Account
      responses:
        '200':
          description: OK
components:
  schemas:
    AccountDeletionRequest:
      required:
      - confirmation
      - wechat_code
      - acknowledge_forfeiture
      - deletion_version
      type: object
      properties:
        confirmation:
          type:
          - 'null'
          - string
        wechat_code:
          type:
          - 'null'
          - string
        acknowledge_forfeiture:
          type: boolean
        deletion_version:
          type:
          - 'null'
          - string
    AccountLoginRequest:
      required:
      - username
      - password
      type: object
      properties:
        username:
          type:
          - 'null'
          - string
        password:
          type:
          - 'null'
          - string
    AccountOrderRequest:
      required:
      - request_id
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        package_id:
          type:
          - 'null'
          - string
        checkout_attempt_id:
          type:
          - 'null'
          - string
          format: uuid
    AccountRefreshRequest:
      required:
      - refresh_token
      type: object
      properties:
        refresh_token:
          type:
          - 'null'
          - string
    AccountRegistrationRequest:
      required:
      - username
      - password
      - password_confirmation
      - captcha_id
      - captcha_answer
      type: object
      properties:
        username:
          type:
          - 'null'
          - string
        password:
          type:
          - 'null'
          - string
        password_confirmation:
          type:
          - 'null'
          - string
        captcha_id:
          type: string
          format: uuid
        captcha_answer:
          type:
          - 'null'
          - string
    AccountWechatLoginRequest:
      required:
      - code
      type: object
      properties:
        code:
          type:
          - 'null'
          - string
    AppEnvelope:
      required:
      - code
      - message
      type: object
      properties:
        code:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        message:
          type: string
        data: {}
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          $ref: '#/components/schemas/JsonElement'
    ChatRequest:
      required:
      - model
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        enable_thinking:
          type: boolean
        temperature:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - number
          - string
          format: double
        max_tokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        thinking_budget_tokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        translation_options:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChatTranslationOptions'
    ChatTranslationOptions:
      type: object
      properties:
        source_lang:
          type:
          - 'null'
          - string
        target_lang:
          type:
          - 'null'
          - string
        domains:
          type:
          - 'null'
          - string
        terms:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/ChatTranslationTerm'
        tm_list:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/ChatTranslationTerm'
    ChatTranslationTerm:
      required:
      - source
      - target
      type: object
      properties:
        source:
          type: string
        target:
          type: string
    IFormFile:
      type: string
      format: binary
    JsonElement: {}
    PublicProblem:
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - trace_id
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        retry_after_seconds:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
    TranslationRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TranslationType'
        content:
          type: array
          items:
            type: string
        from:
          type: string
        to:
          type: string
        domain:
          type: string
    TranslationType:
      type: integer
tags:
- name: Health
- name: Chat
- name: Translation
- name: Table
- name: Latex
- name: Account
