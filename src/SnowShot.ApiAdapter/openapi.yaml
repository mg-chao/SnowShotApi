  /api/v2/purchases/orders:
    post:
      tags:
      - Account
      description: Provide package_id to create an order. Omit package_id and supply
        checkout_attempt_id to look up a retained order without issuing payment parameters.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountOrderRequest'
        required: true
      responses:
        '200':
          description: OK
