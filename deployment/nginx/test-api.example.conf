# Example only: configure your own test domain and certificate paths.
# Test traffic reaches the developer workstation through a loopback SSH listener.
server {
    listen 80;
    listen [::]:80;
    server_name test-api.example.test;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snowshot-test-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test-api.example.test;

    ssl_certificate /etc/letsencrypt/live/test-api.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-api.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/snowshot-test-access.log;
    error_log /var/log/nginx/snowshot-test-error.log;
    add_header X-Snowshot-Environment local-test always;
    add_header Cache-Control "no-store" always;

    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:15101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;
        send_timeout 310s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_cache off;
    }
}
