# Legacy client migration to the published Snow Shot 1.3.5 release.
# Include inside the snowshot.top HTTPS server, before other regex locations.
# Keep this version aligned with deployment/legacy-updates/latest-version.json.

location = /latest-version.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /latest-version.txt {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ~ ^/setup/snow-shot_windows-x64-(online\.exe|offline\.exe|online-update\.zip|offline-update\.zip|portable\.zip)(\.sha256)?$ {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-windows-x64-$1$2;
}

location ~ ^/setup/snow-shot_macos-(arm64|x86_64)(\.dmg(?:\.sha256)?)$ {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-macos-$1$2;
}

location = /setup/snow-shot_macos-x64.dmg {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-macos-x86_64.dmg;
}

location = /setup/install-snow-shot-macos.sh {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/install-snow-shot-macos.sh;
}

location = "/setup/Snow Shot_windows-x64.exe" {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-windows-x64-online.exe;
}

location = "/setup/Snow Shot_windows-x64-fixedRuntime.exe" {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-windows-x64-offline.exe;
}

location = "/setup/Snow Shot_windows-x64-portable.zip" {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-windows-x64-portable.zip;
}

location = "/setup/Snow Shot_macos-aarch64.dmg" {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-macos-arm64.dmg;
}

location = "/setup/Snow Shot_macos-x64.dmg" {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/download/v1.3.5_snow-shot/snow-shot-1.3.5-macos-x86_64.dmg;
}

# Unknown historical package names lead to the release's download choices.
location ~* \.(exe|dmg|zip|rar|7z|tar|gz|apk|deb|rpm)$ {
    add_header Cache-Control "no-store" always;
    return 302 https://gitee.com/mg-chao/snow-apps/releases/tag/v1.3.5_snow-shot;
}
